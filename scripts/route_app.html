<style>
  html, body, #map { margin:0; height:100vh; font-family: DejaVu Sans, sans-serif; }
  #panel {
    position:absolute; z-index:1000; top:10px; left:10px; width:360px; max-width:calc(100vw - 20px);
    background:#1b1f27; color:#eee; padding:12px; border-radius:8px;
    box-shadow:0 2px 10px rgba(0,0,0,.5); font-size:13px;
  }
  #panel h1 { font-size:15px; margin:0 0 8px; }
  input, select, button { width:100%; box-sizing:border-box; padding:8px 10px; margin:3px 0;
                   font-size:14px; background:#2a3040; color:#eee;
                   border:1px solid #444; border-radius:4px; min-height:40px; }
  button { cursor:pointer; }
  button:hover { background:#3a4258; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .sug { background:#222836; border:1px solid #444; border-radius:4px;
         max-height:130px; overflow:auto; margin:-2px 0 4px; }
  .sug div { padding:5px 8px; cursor:pointer; }
  .sug div:hover, .sug div.active { background:#3a4258; }
  .sug div.exact { border-left:3px solid #00e676; }
  #result { max-height:40vh; overflow:auto; margin-top:8px; font-size:12px; }
  #result table { width:100%; border-collapse:collapse; }
  #result td { padding:2px 4px; border-bottom:1px solid #333; }
  .stat { font-size:14px; margin:4px 0; }
  .hint { color:#9aa; font-size:11px; margin-top:6px; }
  .flag { color:#f39c12; }
  .label { color:#8fd; font-size:11px; min-height:14px; }
  .warn { color:#f39c12; font-size:11px; }
  .pointRow { display:flex; align-items:center; gap:4px; margin:3px 0; padding:2px; border-radius:4px; }
  .pointRow input { flex:1; }
  .pointRow .handle { cursor:grab; color:#9aa; font-size:18px; width:24px; text-align:center; user-select:none; }
  .pointRow .badge { font-size:11px; padding:2px 6px; border-radius:10px; min-width:44px; text-align:center; font-weight:bold; }
  .pointRow .badge.start { background:#00e676; color:#000; }
  .pointRow .badge.stop { background:#ffb300; color:#000; }
  .pointRow .badge.dest { background:#ff5252; color:#fff; }
  .pointRow .rm, .pointRow .mv { width:30px; min-height:30px; padding:2px; font-size:13px; }
  .routArrow .chevron {
    width:0; height:0;
    border-left:7px solid transparent;
    border-right:7px solid transparent;
    border-bottom:11px solid #ffffff;
  }
  #loading {
    position:fixed; inset:0; z-index:2000; background:#0f131a; color:#eee;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-size:14px;
  }
  .spinner { width:36px; height:36px; border:4px solid #333; border-top-color:#00b1ff;
    border-radius:50%; animation:spin 1s linear infinite; margin-bottom:12px; }
  @keyframes spin { to { transform:rotate(360deg);} }
  .recent { margin-top:6px; }
  .recent div { padding:3px 6px; cursor:pointer; font-size:11px; color:#bcd; }
  .recent div:hover { background:#2a3040; border-radius:3px; }
  .export { display:flex; gap:4px; margin-top:4px; }
  .export button { flex:1; font-size:11px; padding:4px; }
  @media (max-width: 600px) {
    #panel { top:auto; bottom:10px; left:10px; right:10px; width:auto; max-height:60vh; overflow:auto; }
    input, select, button { min-height:44px; font-size:15px; }
    #result { font-size:13px; }
    .sug div { padding:8px 10px; font-size:14px; }
  }
</style>
</head>
<body>
<div id="loading"><div class="spinner"></div><div id="loadingText">Lade Straßennetz…</div></div>
<div id="panel">
  <h1>KiezRouter</h1>

  <div id="pointsList"></div>

  <button id="btnAddStop" style="font-size:12px;padding:4px 8px;min-height:32px;">+ Punkt hinzufügen</button>
  <div class="hint" style="margin-top:2px;">Stationen (U/S-Bahn) durch Eingabe des Namens suchbar.</div>

  <div style="display:flex; gap:4px; margin:3px 0;">
    <button id="modeCar" style="flex:1; background:#3a4258;">Auto</button>
    <button id="modeWalk" style="flex:1;" disabled>Fuß (lädt…)</button>
  </div>
  <button id="btn" style="background:#00b1ff;color:#000;font-weight:bold;">Route berechnen</button>
  <button id="btnClear" style="opacity:.85">Auswahl löschen</button>
  <button id="btnSwap" style="opacity:.85">Umkehren</button>

  <button id="btnGps" style="font-size:12px;padding:4px 8px;min-height:32px;width:auto;margin:2px 0;" title="GPS-Standort als erster Punkt setzen">📍 Mein Standort (Start)</button>

  <div class="export">
    <button id="btnCopy" disabled>Link kopieren</button>
    <button id="btnGpx" disabled>GPX exportieren</button>
  </div>

  <div id="result" class="hint" aria-live="polite">Lade Adressen…</div>
  <div class="hint">Alternativ: Karte anklicken (erster Klick = Start, zweiter = Ziel).</div>

  <div class="recent" id="recentBox"></div>
</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
<script>
const map = L.map('map', { zoomControl: false, maxZoom: 19 }).setView([52.517, 13.41], 11);
L.control.zoom({ position: 'bottomright' }).addTo(map);
const baseEsri = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}',
  {attribution: 'Tiles © Esri – Quellen: Esri, USGS', maxZoom:19, maxNativeZoom:16}).addTo(map);
const baseOsm = L.tileLayer('https://tile.openstreetmap.de/{z}/{x}/{y}.png',
  {attribution: '© OpenStreetMap-Mitwirkende (FOSSGIS)', maxZoom:19, maxNativeZoom:18});
L.control.layers({'Esri Dunkel': baseEsri, 'OpenStreetMap (DE)': baseOsm},
                 {}, {collapsed:true}).addTo(map);

let lineLayer = L.layerGroup().addTo(map);
const PICK = {};
const DIRTY = {};
let markers = {};
let lastRouteCoords = null;
let currentAbort = {};
let pointCounter = 0;
let points = [];  // ordered list of point keys

function setResult(html) { document.getElementById('result').innerHTML = html; }

// --- Health / loading poll ---
let MODE = 'car';
async function waitReady() {
  while (true) {
    try {
      const r = await fetch('/health');
      if (r.ok) { const d = await r.json(); if (d.ready) return d; }
    } catch (e) {}
    await new Promise(res => setTimeout(res, 1000));
  }
}
function updateModeButtons() {
  document.getElementById('modeCar').style.background = MODE === 'car' ? '#3a4258' : '';
  document.getElementById('modeWalk').style.background = MODE === 'walk' ? '#3a4258' : '';
}

function pointColor(idx, total) {
  if (idx === 0) return '#00e676';
  if (idx === total - 1) return '#ff5252';
  return '#ffb300';
}
function pointLabel(idx, total) {
  if (idx === 0) return 'Start';
  if (idx === total - 1) return 'Ziel';
  return String(idx);
}

function markPicked(key) {
  const item = PICK[key];
  if (!item) return;
  if (markers[key]) lineLayer.removeLayer(markers[key]);
  const idx = points.indexOf(key);
  const total = points.length;
  const color = pointColor(idx, total);
  const num = pointLabel(idx, total);
  const isText = num === 'Start' || num === 'Ziel';
  const w = isText ? 40 : 22, h = 22;
  markers[key] = L.marker([item.lat, item.lon], {
    icon: L.divIcon({
      className: 'ptMarker',
      html: `<div style="background:${color};color:#000;min-width:${w}px;height:${h}px;padding:0 6px;border-radius:${h/2}px;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:${isText?9:12}px;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.5);white-space:nowrap;">${num}</div>`,
      iconSize: [isText ? (num==='Start'?44:40) : 22, h], iconAnchor: [isText ? (num==='Start'?22:20) : 11, h/2],
    })
  }).addTo(lineLayer).bindTooltip(item.label);
}

function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// --- Suggest (generic) ---
function attachSuggest(inputId, sugId, lblId, key) {
  const input = document.getElementById(inputId);
  const sug = document.getElementById(sugId);
  const lbl = document.getElementById(lblId);
  let timer = null;
  let activeIdx = -1;
  sug.addEventListener('click', e => e.stopPropagation());
  sug.addEventListener('touchstart', e => e.stopPropagation(), {passive: true});

  async function runQuery(q) {
    if (currentAbort[key]) currentAbort[key].abort();
    const ctrl = new AbortController();
    currentAbort[key] = ctrl;
    let list;
    try {
      const res = await fetch('/geocode?q=' + encodeURIComponent(q), {signal: ctrl.signal});
      if (!res.ok) throw new Error('HTTP ' + res.status);
      list = await res.json();
    } catch (e) {
      if (e.name === 'AbortError') return;
      sug.innerHTML = '<div class="warn">Fehler bei der Suche.</div>';
      sug.style.display = 'block';
      return;
    }
    currentAbort[key] = null;
    if (!list.length) {
      sug.innerHTML = '<div>– keine Treffer –</div>';
      sug.style.display = 'block';
      return;
    }
    const hasNum = /\d/.test(q);
    const typedHnr = (q.trim().split(/\s+/).pop() || '').toLowerCase();
    const exactExists = hasNum && list.some(it => (it.label.split(' (')[0].split(/\s+/).pop() || '').toLowerCase() === typedHnr);
    sug.innerHTML = '';
    activeIdx = -1;
    for (let i = 0; i < list.length; i++) {
      const item = list[i];
      const d = document.createElement('div');
      const isExact = hasNum && (item.label.split(' (')[0].split(/\s+/).pop() || '').toLowerCase() === typedHnr;
      if (isExact) d.classList.add('exact');
      d.textContent = item.label;
      d.dataset.idx = i;
      d.onclick = (e) => { e.stopPropagation(); selectItem(item); };
      sug.appendChild(d);
    }
    if (hasNum && !exactExists) {
      const hint = document.createElement('div');
      hint.className = 'warn';
      hint.textContent = 'Keine exakte Hausnummer – zeige ähnliche.';
      sug.appendChild(hint);
    }
    sug.style.display = 'block';
  }

  function selectItem(item) {
    PICK[key] = item;
    DIRTY[key] = false;
    input.value = item.label.split(' (')[0];
    lbl.textContent = '✓ ' + item.label;
    sug.style.display = 'none';
    const isMobile = window.innerWidth <= 600;
    if (isMobile) {
      const onEnd = () => { map.off('moveend', onEnd); const h = document.getElementById('panel').offsetHeight || window.innerHeight * 0.55; map.panBy([0, -Math.round(h * 0.6)], {animate: true}); };
      map.on('moveend', onEnd);
    }
    map.flyTo([item.lat, item.lon], 16);
    markPicked(key);
    refreshBadges();
    saveRecent();
  }

  input.addEventListener('input', () => {
    const q = input.value.trim();
    if (q.length < 3) { sug.style.display = 'none'; sug.innerHTML = ''; return; }
    const pickedLabel = PICK[key] ? PICK[key].label.split(' (')[0] : '';
    if (pickedLabel && q !== pickedLabel) { DIRTY[key] = true; }
    clearTimeout(timer);
    timer = setTimeout(() => runQuery(q), 300);
  });

  input.addEventListener('keydown', (e) => {
    const items = Array.from(sug.querySelectorAll('div[data-idx]'));
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (!items.length) return;
      activeIdx = Math.min(items.length - 1, activeIdx + 1);
      items.forEach((d, i) => d.classList.toggle('active', i === activeIdx));
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (!items.length) return;
      activeIdx = Math.max(0, activeIdx - 1);
      items.forEach((d, i) => d.classList.toggle('active', i === activeIdx));
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (activeIdx >= 0 && items[activeIdx]) items[activeIdx].click();
    } else if (e.key === 'Escape') {
      sug.style.display = 'none';
    }
  });

  input.addEventListener('blur', () => setTimeout(() => sug.style.display = 'none', 200));
}

function refreshBadges() {
  const total = points.length;
  points.forEach((key, idx) => {
    const badge = document.querySelector(`[data-point-key="${key}"] .badge`);
    if (!badge) return;
    badge.className = 'badge ' + (idx === 0 ? 'start' : (idx === total-1 ? 'dest' : 'stop'));
    badge.textContent = idx === 0 ? 'S' : (idx === total-1 ? 'Z' : String(idx));
  });
  // re-render markers with updated colors/numbers
  points.forEach(k => { if (PICK[k]) markPicked(k); });
}

function createPoint() {
  const key = 'p' + (pointCounter++);
  const row = document.createElement('div');
  row.className = 'pointRow';
  row.draggable = true;
  row.dataset.key = key;
  row.innerHTML = `
    <span class="handle" title="Ziehen zum Verschieben">≡</span>
    <span class="badge stop">Stop</span>
    <input id="addr_${key}" placeholder="Adresse (Straße Nr.)" aria-label="Adresse">
    <button class="mv" data-dir="up" title="Nach oben">↑</button>
    <button class="mv" data-dir="down" title="Nach unten">↓</button>
    <button class="rm" title="Entfernen">✕</button>
  `;
  const sug = document.createElement('div');
  sug.id = 'sug_' + key; sug.className = 'sug'; sug.style.display = 'none';
  const lbl = document.createElement('div');
  lbl.id = 'lbl_' + key; lbl.className = 'label'; lbl.setAttribute('aria-live','polite');
  const wrap = document.createElement('div');
  wrap.dataset.pointKey = key;
  wrap.appendChild(row);
  wrap.appendChild(sug);
  wrap.appendChild(lbl);
  document.getElementById('pointsList').appendChild(wrap);

  attachSuggest('addr_' + key, 'sug_' + key, 'lbl_' + key, key);
  points.push(key);

  // remove
  row.querySelector('.rm').onclick = () => {
    if (points.length <= 2) { setResult('Mindestens Start und Ziel nötig.'); return; }
    const idx = points.indexOf(key);
    if (idx >= 0) points.splice(idx, 1);
    wrap.remove();
    delete PICK[key]; delete DIRTY[key];
    if (markers[key]) { lineLayer.removeLayer(markers[key]); delete markers[key]; }
    refreshAll();
  };
  // move up/down
  row.querySelectorAll('.mv').forEach(b => {
    b.onclick = () => {
      const idx = points.indexOf(key);
      if (b.dataset.dir === 'up' && idx > 0) {
        [points[idx-1], points[idx]] = [points[idx], points[idx-1]];
        reorderDOM();
      } else if (b.dataset.dir === 'down' && idx < points.length - 1) {
        [points[idx], points[idx+1]] = [points[idx+1], points[idx]];
        reorderDOM();
      }
    };
  });
  // drag and drop
  row.addEventListener('dragstart', e => { e.dataTransfer.setData('text/plain', key); row.style.opacity = '0.5'; });
  row.addEventListener('dragend', () => { row.style.opacity = ''; });
  row.addEventListener('dragover', e => { e.preventDefault(); row.style.outline = '2px dashed #00b1ff'; });
  row.addEventListener('dragleave', () => { row.style.outline = ''; });
  row.addEventListener('drop', e => {
    e.preventDefault(); row.style.outline = '';
    const srcKey = e.dataTransfer.getData('text/plain');
    if (srcKey === key) return;
    const fromIdx = points.indexOf(srcKey);
    const toIdx = points.indexOf(key);
    if (fromIdx < 0 || toIdx < 0) return;
    points.splice(fromIdx, 1);
    points.splice(toIdx, 0, srcKey);
    reorderDOM();
  });

  refreshAll();
}

function reorderDOM() {
  const container = document.getElementById('pointsList');
  const wraps = Array.from(container.children);
  const byKey = {};
  wraps.forEach(w => {
    const row = w.querySelector('.pointRow');
    if (row) byKey[row.dataset.key] = w;
  });
  container.innerHTML = '';
  points.forEach(k => { if (byKey[k]) container.appendChild(byKey[k]); });
  refreshAll();
}

function refreshAll() {
  refreshBadges();
  // update marker colors/numbers
  points.forEach(k => { if (PICK[k]) markPicked(k); });
}

function refreshBadges() {
  const total = points.length;
  points.forEach((key, idx) => {
    const badge = document.querySelector(`[data-point-key="${key}"] .badge`);
    if (!badge) return;
    badge.className = 'badge ' + (idx === 0 ? 'start' : (idx === total-1 ? 'dest' : 'stop'));
    badge.textContent = idx === 0 ? 'S' : (idx === total-1 ? 'Z' : String(idx));
  });
}

// start with 2 points (start + dest)
createPoint();
createPoint();

document.getElementById('btnAddStop').onclick = () => {
  // insert before last (dest) if >=2 points
  const key = null; // placeholder
  createPoint();
  // move new point to before last
  const newKey = points.pop();
  if (points.length >= 1) points.splice(points.length - 1, 0, newKey);
  else points.push(newKey);
  reorderDOM();
};

// --- GPS start ---
document.getElementById('btnGps').onclick = () => {
  if (!navigator.geolocation) { setResult('Geolocation nicht verfügbar.'); return; }
  setResult('Ermittle Standort…');
  navigator.geolocation.getCurrentPosition(pos => {
    const lat = pos.coords.latitude, lon = pos.coords.longitude;
    if (!points.length) createPoint();
    const firstKey = points[0];
    PICK[firstKey] = {label: 'Mein Standort', lat, lon};
    DIRTY[firstKey] = false;
    document.getElementById('addr_' + firstKey).value = 'Mein Standort';
    document.getElementById('lbl_' + firstKey).textContent = '✓ GPS-Standort (' + lat.toFixed(5) + ', ' + lon.toFixed(5) + ')';
    if (markers[firstKey]) lineLayer.removeLayer(markers[firstKey]);
    markers[firstKey] = L.circleMarker([lat, lon], {radius:8, color:'#00e676', fillOpacity:1, weight:2}).addTo(lineLayer);
    map.flyTo([lat, lon], 15);
    setResult('Standort gesetzt. Ziel wählen und Route berechnen.');
    refreshAll();
  }, err => {
    setResult('Standort konnte nicht ermittelt werden: ' + (err.message || err.code));
  }, {enableHighAccuracy: true, timeout: 10000});
};

// --- Mode toggle ---
document.getElementById('modeCar').onclick = () => { MODE = 'car'; updateModeButtons(); };
document.getElementById('modeWalk').onclick = () => { if (document.getElementById('modeWalk').disabled) return; MODE = 'walk'; updateModeButtons(); };

// --- Routing ---
const ARROW_SPACING_M = 600;
function routeArrows(route) {
  const pts = route.map(c => L.latLng(c[0], c[1]));
  let acc = 0;
  for (let i = 1; i < pts.length; i++) {
    const d = pts[i].distanceTo(pts[i - 1]);
    acc += d;
    if (acc >= ARROW_SPACING_M) {
      acc = 0;
      const dLat = pts[i].lat - pts[i - 1].lat;
      const dLon = pts[i].lng - pts[i - 1].lng;
      const bearing = Math.atan2(dLon, dLat) * 180 / Math.PI;
      const mid = L.latLng((pts[i].lat + pts[i - 1].lat) / 2,
                           (pts[i].lng + pts[i - 1].lng) / 2);
      const icon = L.divIcon({
        className: 'routArrow',
        html: `<div class="chevron" style="transform: rotate(${bearing.toFixed(1)}deg)"></div>`,
        iconSize: [18, 18], iconAnchor: [9, 9],
      });
      L.marker(mid, {icon, interactive:false}).addTo(lineLayer);
    }
  }
}

function collectPoints() {
  const pts = [];
  for (const k of points) {
    if (PICK[k]) pts.push([PICK[k].lat, PICK[k].lon]);
  }
  return pts;
}

async function berechne(pushHash = true) {
  const dirtyKeys = points.filter(k => DIRTY[k]);
  if (dirtyKeys.length) {
    setResult('Adresse wurde geändert – bitte einen Vorschlag aus der Liste wählen.');
    return;
  }
  const pts = collectPoints();
  if (pts.length < 2) {
    setResult('Mindestens Start und Ziel (2 Punkte) nötig.');
    return;
  }
  const q = 'points=' + pts.map(p => p[0] + ',' + p[1]).join(';') + '&mode=' + MODE;
  setResult('<div style="display:flex;align-items:center;gap:8px;"><div class="spinner" style="width:18px;height:18px;border-width:3px;"></div> Lade Route…</div>');
  let data;
  try {
    const res = await fetch('/route?' + q);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    data = await res.json();
  } catch (e) {
    setResult('Fehler: ' + escapeHtml(e.message || e));
    return;
  }
  if (data.error) { setResult(escapeHtml(data.error)); return; }
  lineLayer.clearLayers(); markers = {};
  L.polyline(data.route, {color:'#00b1ff', weight:5, opacity:0.9})
    .bindTooltip((data.start || '') + ' → ' + (data.ziel || '')).addTo(lineLayer);
  routeArrows(data.route);
  if (data.route.length) {
    L.circleMarker(data.route[0], {radius:7, color:'#00e676', fillOpacity:1})
      .addTo(lineLayer).bindTooltip('Start: ' + data.start);
    L.circleMarker(data.route[data.route.length - 1], {radius:7, color:'#ff5252', fillOpacity:1})
      .addTo(lineLayer).bindTooltip('Ziel: ' + data.ziel);
  }
  // intermediate markers
  for (let i = 1; i < points.length - 1; i++) {
    const k = points[i];
    if (PICK[k]) {
      L.circleMarker([PICK[k].lat, PICK[k].lon], {radius:6, color:'#ffb300', fillOpacity:1, weight:2})
        .addTo(lineLayer).bindTooltip(PICK[k].label);
    }
  }
  const fitOpts = window.innerWidth <= 600
    ? {paddingTopLeft:[30,30], paddingBottomRight:[30, Math.round((document.getElementById('panel').offsetHeight || window.innerHeight*0.55) + 20)]}
    : {padding:[30,30]};
  map.fitBounds(L.polyline(data.route).getBounds(), fitOpts);
  lastRouteCoords = data.route;
  document.getElementById('btnCopy').disabled = false;
  document.getElementById('btnGpx').disabled = false;
  const dot = v => String(v).replace('.', ',');
  const timeLabel = MODE === 'walk' ? 'Laufzeit' : 'Fahrzeit';
  const luft = (data.luft_km != null) ? dot(data.luft_km) : '–';
  const infl = (data.inflation != null && isFinite(data.inflation)) ? dot(data.inflation) : '–';
  let rows = `<div class="stat">Distanz: <b>${dot(data.km)} km</b> · ${timeLabel}: <b>${dot(data.minuten)} min</b></div>`;
  rows += `<button id="toggleDetails" style="font-size:11px;padding:3px 6px;margin:4px 0;width:auto;">Details ▾</button>`;
  rows += `<div id="detailsBox">`;
  rows += `<div class="stat">Luftlinie: ${luft} km · Inflation: ${infl}×</div>`;
  rows += `<button id="toggleStrassen" style="font-size:11px;padding:3px 6px;margin:4px 0;width:auto;">Straßenliste ▾</button>`;
  rows += `<div id="strassenBox" style="overflow-x:auto;max-width:100%;"><table style="min-width:100%;">`;
  for (const s of data.strassen) {
    rows += `<tr><td>${escapeHtml(s.name).replace('BRÜCKE', '<span class="flag">BRÜCKE</span>').replace('TUNNEL', '<span class="flag">TUNNEL</span>')}</td>` +
            `<td style="text-align:right">${s.kanten}</td></tr>`;
  }
  rows += '</table></div>';
  rows += '</div>';
  setResult(rows);
  // details collapse (everything below Distanz)
  const detailsBox = document.getElementById('detailsBox');
  const detailsBtn = document.getElementById('toggleDetails');
  let detailsOpen = true;
  detailsBtn.onclick = () => {
    detailsOpen = !detailsOpen;
    detailsBox.style.display = detailsOpen ? '' : 'none';
    detailsBtn.textContent = detailsOpen ? 'Details ▾' : 'Details ▸';
  };
  // streets collapse
  const box = document.getElementById('strassenBox');
  const btn = document.getElementById('toggleStrassen');
  let open = true;
  btn.onclick = () => {
    open = !open;
    box.style.display = open ? '' : 'none';
    btn.textContent = open ? 'Straßenliste ▾' : 'Straßenliste ▸';
  };

  if (pushHash) {
    const from = data.route[0], to = data.route[data.route.length-1];
    location.hash = 'from=' + from[0] + ',' + from[1] + '&to=' + to[0] + ',' + to[1] + '&mode=' + MODE;
  }
}

document.getElementById('btn').onclick = () => berechne(true);

document.getElementById('btnClear').onclick = () => {
  points.forEach(k => { delete PICK[k]; delete DIRTY[k]; if (markers[k]) lineLayer.removeLayer(markers[k]); delete markers[k]; });
  points = [];
  document.getElementById('pointsList').innerHTML = '';
  createPoint(); createPoint();
  document.getElementById('btnCopy').disabled = true;
  document.getElementById('btnGpx').disabled = true;
  lineLayer.clearLayers();
  setResult('Auswahl gelöscht.');
};

document.getElementById('btnSwap').onclick = () => {
  // reverse order (start <-> dest, stops reversed)
  points.reverse();
  reorderDOM();
  setResult('Reihenfolge umgekehrt.');
};

// --- Export ---
document.getElementById('btnCopy').onclick = async () => {
  try {
    await navigator.clipboard.writeText(location.href);
    setResult('Link in Zwischenablage kopiert.');
  } catch (e) { setResult('Kopieren fehlgeschlagen.'); }
};
document.getElementById('btnGpx').onclick = () => {
  if (!lastRouteCoords) return;
  let gpx = '<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="KiezRouter">\n<trk><name>Route</name><trkseg>\n';
  for (const c of lastRouteCoords) gpx += `<trkpt lat="${c[0]}" lon="${c[1]}"></trkpt>\n`;
  gpx += '</trkseg></trk>\n</gpx>';
  const blob = new Blob([gpx], {type:'application/gpx+xml'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'route.gpx'; a.click();
  URL.revokeObjectURL(url);
};

// --- Recent searches ---
function getRecent() { try { return JSON.parse(localStorage.getItem('recentRoutes') || '[]'); } catch (e) { return []; } }
function saveRecent() {
  const pts = collectPoints();
  if (pts.length < 2) return;
  const first = points[0] ? PICK[points[0]] : null;
  const last = points[points.length-1] ? PICK[points[points.length-1]] : null;
  if (!first || !last) return;
  const item = {a: first.label, b: last.label, pts: pts};
  let r = getRecent().filter(x => !(x.a === item.a && x.b === item.b));
  r.unshift(item); r = r.slice(0, 5);
  localStorage.setItem('recentRoutes', JSON.stringify(r));
  renderRecent();
}
function renderRecent() {
  const box = document.getElementById('recentBox');
  const r = getRecent();
  if (!r.length) { box.innerHTML = ''; return; }
  box.innerHTML = '<div class="hint">Letzte Routen:</div>';
  for (const it of r) {
    const d = document.createElement('div');
    d.textContent = it.a.split(' (')[0] + ' → ' + it.b.split(' (')[0] + (it.pts.length > 2 ? ' (+' + (it.pts.length-2) + ' Stops)' : '');
    d.onclick = () => {
      berechne('points=' + it.pts.map(p => p[0] + ',' + p[1]).join(';') + '&mode=' + MODE, false);
    };
    box.appendChild(d);
  }
}


// --- Init ---
async function init() {
  const d = await waitReady();
  document.getElementById('loading').style.display = 'none';
  (async () => {
    let wr = d.walk_ready;
    const btn = document.getElementById('modeWalk');
    while (!wr) {
      await new Promise(res => setTimeout(res, 2000));
      try { const r = await fetch('/health'); if (r.ok) { const dd = await r.json(); wr = dd.walk_ready; } } catch (e) {}
    }
    btn.disabled = false; btn.textContent = 'Fuß';
  })();
  renderRecent();
  updateModeButtons();
  const hash = location.hash.replace(/^#/, '');
  const params = new URLSearchParams(hash);
  if (params.has('from') && params.has('to')) {
    const [fla, flo] = params.get('from').split(',').map(Number);
    const [tla, tlo] = params.get('to').split(',').map(Number);
    if (isFinite(fla) && isFinite(flo) && isFinite(tla) && isFinite(tlo)) {
      const m = params.get('mode'); if (m === 'walk' || m === 'car') MODE = m;
      updateModeButtons();
      berechne('from_lat=' + fla + '&from_lon=' + flo + '&to_lat=' + tla + '&to_lon=' + tlo + '&mode=' + MODE, false);
    }
  }
}
init();
</script>
